name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, mobile-multirole-preview, mobile-receipts-stats-links-preview, android-background-gps-web-print-preview]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'components/capacitor-native-bridge.tsx'
      - 'components/native-space-switcher.tsx'
      - 'components/driver-native-open.tsx'
      - 'app/livreur/**'
      - 'app/mobile/**'
      - 'app/mobile-hardening.css'
      - 'lib/escpos-printer.ts'
      - 'lib/order-receipt.ts'
      - 'scripts/patch-android-deeplinks.mjs'
      - 'scripts/fix-android-background-service.mjs'
      - '.github/workflows/android-debug-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/patch-android-deeplinks.mjs
      - run: node scripts/fix-android-background-service.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qatalink-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
